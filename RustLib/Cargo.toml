[package]
name = "rust_cache"
version = "2.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19.0"
lru = "0.12.3"
ahash = "0.8"
parking_lot = "0.12"
serde_json = "1.0"
libc = "0.2"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Memory",
    "Win32_System_Threading"
] }